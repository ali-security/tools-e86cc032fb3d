name: seal-build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Package pattern(s) passed to go test (default ./...)'
        required: false
        default: ''

jobs:
  module-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.13.15'

      - name: Regenerate godoc/static (go1.13.15)
        env:
          GO111MODULE: 'on'
          GOPROXY: 'https://proxy.golang.org,direct'
          GOFLAGS: ''
        run: |
          go version
          go generate ./godoc/static
          git status --short
          git diff --stat

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build module zip helper
        env:
          GOFLAGS: '-mod=mod'
          GOTOOLCHAIN: 'local'
          GOPROXY: 'https://proxy.golang.org,direct'
        run: |
          go version
          H=$(mktemp -d)
          cp .github/create_mod.go "$H/"
          sed -i '/^\/\/go:build ignore/d;/^\/\/ +build ignore/d' "$H/create_mod.go"
          cd "$H"
          go mod init sealhelper
          go get golang.org/x/mod@v0.24.0
          go build -o "$RUNNER_TEMP/create_mod" create_mod.go

      - name: Stage clean source copy
        run: |
          mkdir -p "$RUNNER_TEMP/stage"
          tar --exclude=./.git --exclude=./.github -cf - . | tar -xf - -C "$RUNNER_TEMP/stage"

      - name: Create module zip
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          Z="$RUNNER_TEMP/out/v0.0.0-20200619180055-7c47624df98f.zip"
          "$RUNNER_TEMP/create_mod" golang.org/x/tools v0.0.0-20200619180055-7c47624df98f "$RUNNER_TEMP/stage" "$Z"
          unzip -l "$Z" | tail -3
          if unzip -Z1 "$Z" | grep -q '/\.github/'; then echo "workflow leaked into zip"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: module-zip
          path: ${{ runner.temp }}/out/v0.0.0-20200619180055-7c47624df98f.zip
          if-no-files-found: error

  test:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15-intel]
        include:
          # internal/span TestURIFromPath and the gopls tests assume the
          # sources live on drive C:, as on the Go windows builders; the
          # runner workspace is on D:, so the suite runs from a copy on C:.
          - os: windows-latest
            workdir: 'C:\tools'
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      GO111MODULE: 'on'
      GOPROXY: 'https://proxy.golang.org,direct'
      GOFLAGS: ''
    steps:
      - name: Disable autocrlf (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.13.15'

      - name: Install MINGW64 gcc (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Configure MINGW64 gcc and temp dirs (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" >> "$GITHUB_PATH"
          mkdir -p /c/tools /c/tmp
          cp -a . /c/tools/
          echo "TEMP=C:\tmp" >> "$GITHUB_ENV"
          echo "TMP=C:\tmp" >> "$GITHUB_ENV"

      - name: Backport cgo unnamed DWARF variable fix (macOS)
        if: runner.os == 'macOS'
        # Current Xcode clang emits unnamed DW_TAG_variable entries for string
        # constants, which Go 1.13 cgo rejects ("malformed DWARF TagVariable
        # entry" building crypto/x509). Apply the upstream cmd/cgo fix shipped
        # in Go 1.18.10/1.19.5 (skip variables with no name) to the 1.13.15
        # toolchain and reinstall cmd/cgo.
        run: |
          CGO_SRC="$(go env GOROOT)/src/cmd/cgo/gcc.go"
          perl -0pi -e 's/\n(\t+)if name == "" \|\| typOff == 0 \{/\n${1}if name == "" {\n${1}\tbreak\n${1}}\n${1}if name == "" || typOff == 0 {/' "$CGO_SRC"
          grep -n -A6 'if name == "" {' "$CGO_SRC"
          go install cmd/cgo

      - name: Install GNU diffutils (macOS)
        if: runner.os == 'macOS'
        # internal/testenv requires GNU diff (diff -version must report
        # "GNU diffutils"); macOS ships the BSD-derived Apple diff.
        run: |
          brew install diffutils
          diff --version

      - name: Show gcc and go env (Windows)
        if: runner.os == 'Windows'
        run: |
          which gcc
          gcc --version
          go env

      - name: Go version
        run: go version && go env

      - name: Regenerate godoc/static (go1.13.15)
        working-directory: ${{ matrix.workdir || github.workspace }}
        run: |
          go generate ./godoc/static
          git status --short

      - name: Build
        working-directory: ${{ matrix.workdir || github.workspace }}
        run: go build ./...

      - name: Test
        working-directory: ${{ matrix.workdir || github.workspace }}
        run: |
          set -o pipefail
          go test -v -p 1 ${{ inputs.test-filter || './...' }} 2>&1 | tee "$RUNNER_TEMP/go-test.log"

      - name: Test summary
        if: always()
        run: |
          LOG="$RUNNER_TEMP/go-test.log"
          if [ ! -f "$LOG" ]; then
            echo "No test log found at $LOG (test step did not run)"
            exit 0
          fi
          # LC_ALL=C: test output contains invalid UTF-8 (go/analysis testdata);
          # macOS awk aborts on it in a UTF-8 locale.
          LC_ALL=C awk -v os="${{ matrix.os }}" '
            /^[ \t]*--- PASS/ { pass++ }
            /^[ \t]*--- FAIL/ { fail++ }
            /^[ \t]*--- SKIP/ { skip++ }
            /^ok /            { pok++ }
            /^ok\t/           { pok++ }
            /^FAIL\t/         { pfail++ }
            /^FAIL /          { pfail++ }
            /no test files/   { pnotest++ }
            END {
              printf "==== TEST SUMMARY (%s, go1.13.15) ====\n", os
              printf "tests passed: %d\n", pass
              printf "tests failed: %d\n", fail
              printf "tests skipped: %d\n", skip
              printf "packages ok: %d\n", pok
              printf "packages failed: %d\n", pfail
              printf "packages with no test files: %d\n", pnotest
            }
          ' "$LOG"
